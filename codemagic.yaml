workflows:
  ios-trollstore:
    name: Build TrollStore IPA
    instance_type: mac_mini_m1
    max_build_duration: 10
    scripts:
      - name: Compile and Package IPA
        script: |
          mkdir -p Payload/StartApp.app
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          swiftc -parse-as-library \
                 -target arm64-apple-ios15.0 \
                 -sdk "$SDK_PATH" \
                 StartApp.swift \
                   -o Payload/StartApp.app/qhun22

                 chmod +x Payload/StartApp.app/qhun22

          # Copy icon vao bundle ung dung
          if [ -f "AppIcon.png" ]; then
            cp AppIcon.png Payload/StartApp.app/AppIcon.png
            # Tao them ban sao @2x va @3x de tuong thich moi dong iPhone
            cp AppIcon.png Payload/StartApp.app/AppIcon60x60@2x.png
            cp AppIcon.png Payload/StartApp.app/AppIcon60x60@3x.png
          fi

          cat << 'EOF' > Payload/StartApp.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>qhun22</string>
              <key>CFBundleIdentifier</key>
              <string>com.qhun22.app</string>
              <key>CFBundleName</key>
              <string>qhun22</string>
              <key>CFBundleDisplayName</key>
              <string>qhun22</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
                <key>CFBundleIcons</key>
                <dict>
                  <key>CFBundlePrimaryIcon</key>
                  <dict>
                    <key>CFBundleIconFiles</key>
                    <array>
                      <string>AppIcon60x60</string>
                      <string>AppIcon</string>
                    </array>
                    <key>CFBundleIconName</key>
                    <string>AppIcon</string>
                  </dict>
                </dict>
          </dict>
          </plist>
          EOF

          zip -r StartApp.ipa Payload
    artifacts:
      - StartApp.ipa
